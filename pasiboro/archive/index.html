<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive • Pasiboro Heritage Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/site.css">
  <script src="../assets/js/catalog.js" defer></script>
</head>
<body>
  <div class="wrap">
    <nav class="topnav" aria-label="Primary navigation">
      <span class="tag">Archive</span>
      <a href="/pasiboro/">Home</a>
      <a href="/pasiboro/biography/">Biography</a>
      <a href="/pasiboro/works/">Works</a>
      <a href="/pasiboro/legacy/">Legacy</a>
      <a href="/pasiboro/search/">Search</a>
    </nav>

    <header class="hero">
      <p class="kicker">Primary Sources</p>
      <h1>Archive Catalog</h1>
      <p>
        Primary-source references and preservation notes. Sensitive/private content remains out of public scope for V1.
      </p>
    </header>

    <section class="section" aria-labelledby="archive-list-heading">
      <h2 id="archive-list-heading">Archive Entries</h2>
      <div id="archive-list" class="grid"></div>
    </section>
    <p class="footer-note">Pasiboro Heritage Archive • Archive</p>
  </div>
  <script>
    fetch("../data/archive.json")
      .then((r) => r.json())
      .then((items) => renderCatalog(items, "archive-list"));
  </script>
</body>
</html>
