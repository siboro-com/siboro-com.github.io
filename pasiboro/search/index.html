<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search • Pasiboro Heritage Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/site.css">
  <script src="../assets/js/search.js" defer></script>
</head>
<body>
  <div class="wrap">
    <nav class="topnav" aria-label="Primary navigation">
      <span class="tag">Search</span>
      <a href="/pasiboro/">Home</a>
      <a href="/pasiboro/biography/">Biography</a>
      <a href="/pasiboro/works/">Works</a>
      <a href="/pasiboro/archive/">Archive</a>
      <a href="/pasiboro/legacy/">Legacy</a>
    </nav>

    <header class="hero">
      <p class="kicker">Discovery</p>
      <h1>Search Works and Archive</h1>
      <p>Find items by title, person, topic, year/date, or source keywords.</p>
    </header>

    <section class="section" aria-labelledby="search-tools">
      <h2 id="search-tools">Search</h2>
      <div class="searchbox">
        <label for="search-input" class="meta">Keyword</label>
        <input id="search-input" type="text" placeholder="Try: mission, charcoal, 2020, Siboro, Sitorus">
      </div>
      <p id="result-count" class="meta">Type to search works and archive.</p>
      <div id="search-results" class="grid"></div>
    </section>
    <p class="footer-note">Pasiboro Heritage Archive • Search</p>
  </div>
</body>
</html>
