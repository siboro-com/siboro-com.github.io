<header class="hero"><p class="kicker">投稿フロー</p><h1>思い出・訂正・資料を送る</h1><p>家族と地域社会からの投稿を歓迎します。すべての投稿は公開前に確認されます。</p></header>
<section class="section" aria-labelledby="how-to-contribute"><h2 id="how-to-contribute">投稿方法</h2><div class="grid">
<article class="card"><h3>思い出の投稿</h3><p>年月、関係人物、出典背景を添えて物語を共有してください。</p></article>
<article class="card"><h3>資料の投稿</h3><p>スキャン/写真と権利・来歴情報を添えて送信してください。</p></article>
<article class="card"><h3>訂正依頼</h3><p>根拠資料とともに事実訂正をお知らせください。</p></article>
</div><p class="meta">一時連絡先 (V1): <a href="mailto:heritage@siboro.org?subject=Pasiboro%20Heritage%20Submission">heritage@siboro.org</a></p></section>
