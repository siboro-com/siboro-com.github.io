<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人物史 • Pasiboro ヘリテージポータル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../pasiboro/assets/css/site.css">
</head>
<body>
  <div class="wrap">
    <nav class="topnav" aria-label="Primary navigation"><span class="tag">人物史</span>
      <a href="/ja/pasiboro/">ホーム</a>
      <a href="/ja/pasiboro/biography/">人物史</a>
      <a href="/ja/pasiboro/works/">作品</a>
      <a href="/ja/pasiboro/legacy/">レガシー</a>
      <a href="/ja/pasiboro/contribute/">投稿</a>
      <a href="/ja/pasiboro/search/">検索</a>
      <a href="/ja/">ポータル</a>
    
      <div class="lang-switch" aria-label="Language switcher">
        <a href="/en/pasiboro/biography/" class="">EN</a>
        <a href="/id/pasiboro/biography/" class="">ID</a>
        <a href="/ja/pasiboro/biography/" class="active">日本語</a>
      </div>
    </nav>
    <header class="hero"><p class="kicker">ライフストーリー</p><h1>P. A. Siboro と L. N. Sitorus の年表</h1><p>この年表は検証済みの節目を示し、追加確認が必要な箇所も明示します。</p></header>
    <section class="section" aria-labelledby="timeline"><h2 id="timeline">主要年表</h2><div id="timeline-list" class="timeline"></div><p class="meta">各項目に検証状況と出典を表示します。</p></section>
    <p class="footer-note">Pasiboro ヘリテージポータル • 人物史</p>
  </div>
  <script>
    fetch(`/pasiboro/data/timeline.ja.json`).then((r) => r.json()).then((items) => {
      const target = document.getElementById("timeline-list");
      target.innerHTML = items.map((i) => `
        <article class="timeline-item">
          <div class="date">${i.date}</div>
          <h3>${i.title}</h3>
          <p>${i.summary}</p>
          <p class="meta"><strong>出典:</strong> ${i.source}</p>
          ${i.sourceUrl ? `<p class="meta"><a href="${i.sourceUrl}" target="_blank" rel="noopener noreferrer">出典を開く</a></p>` : ""}
          <span class="badge ${i.verificationStatus === "verified" ? "status-verified" : "status-pending"}">
            ${i.verificationStatus === "verified" ? "確認済み" : "確認待ち"}
          </span>
        </article>
      `).join("");
    });
  </script>
</body>
</html>
